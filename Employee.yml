apiVersion: apps/v1
kind: Deployment
metadata:
  name: Users-service
  namespace: kubernetes-cluster
  labels:
    app: Employee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: Employee-service
  template:
    metadata:
      name: Employee-service
      labels:
        app: Employee-service
    spec:
      containers:
        - name: Employee-service
          image: mehrabhossain/employeemanagement-backend:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: Employee-service
  namespace: kubernetes-cluster
spec:
  type: ClusterIP
  selector:
    app: Employee-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      