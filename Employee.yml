apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: kubernetes-cluster
  labels:
    app: employee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      name: employee-service
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: mehrabhossain/employeemanagement-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: usermanagement-secret
                  key: DATABASE_URL   
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service 
  namespace: kubernetes-cluster
spec:
  type: ClusterIP
  selector:
    app: employee-service
  ports: 
    - port: 8080
      targetPort: 8080
      protocol: TCP
      