apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: kubernetes-cluster
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mehrabhossain/usermanagement-frontend:latest
          ports:
            - containerPort: 80
--- 

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: kubernetes-cluster
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 80
      protocol: TCP
      