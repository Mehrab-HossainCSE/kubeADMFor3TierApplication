apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kubernetes-cluster
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      name: user-service
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: mehrabhossain/usermanagement-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: usermanagement-secret
                  key: DATABASE_URL 
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kubernetes-cluster
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      