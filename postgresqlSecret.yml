apiVersion: v1
kind: Secret
metadata:
  name: usermanagement-secret
  namespace: kubernetes-cluster
type: Opaque
stringData:
  DATABASE_URL: "Host=postgresql-service;Port=5432;Database=usermanagement;Username=postgres;Password=1234567"